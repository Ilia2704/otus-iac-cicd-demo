name: CI/CD

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    env:
      TF_IN_AUTOMATION: "true"
      TF_VAR_yc_token: ${{ secrets.YC_TOKEN }}
      TF_VAR_yc_cloud_id: ${{ secrets.YC_CLOUD_ID }}
      TF_VAR_yc_folder_id: ${{ secrets.YC_FOLDER_ID }}
      TF_VAR_yc_zone: ${{ secrets.YC_ZONE }}
      TF_VAR_bucket_name: ${{ secrets.YC_BUCKET_NAME }}
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Restore Terraform state
        if: github.event_name == 'push'
        uses: actions/cache/restore@v6
        with:
          path: |
            infra/terraform.tfstate
            infra/terraform.tfstate.backup
          key: terraform-state-${{ github.run_id }}
          restore-keys: |
            terraform-state-

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: Validate Terraform format
        working-directory: infra
        run: terraform fmt -check -recursive

      - name: Initialize Terraform
        working-directory: infra
        run: terraform init -input=false

      - name: Validate Terraform
        working-directory: infra
        run: terraform validate

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/requirements.txt

      - name: Run unit tests
        run: |
          pip install --no-cache-dir -r tests/requirements.txt
          pytest -q tests/test_unit.py

      - name: Build application image
        run: docker build --tag "sentiment-api:${GITHUB_SHA}" app

      - name: Plan infrastructure
        if: github.event_name == 'push'
        working-directory: infra
        run: terraform plan -input=false -out=tfplan

      - name: Apply infrastructure
        if: github.event_name == 'push'
        id: apply
        working-directory: infra
        run: terraform apply -auto-approve tfplan

      - name: Save Terraform state
        if: always() && github.event_name == 'push' && steps.apply.outcome != 'skipped'
        uses: actions/cache/save@v6
        with:
          path: |
            infra/terraform.tfstate
            infra/terraform.tfstate.backup
          key: terraform-state-${{ github.run_id }}

      - name: Read VM address
        if: github.event_name == 'push'
        id: vm
        working-directory: infra
        run: echo "ip=$(terraform output -raw vm_external_ip)" >> "$GITHUB_OUTPUT"

      - name: Prepare SSH
        if: github.event_name == 'push'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          VM_IP: ${{ steps.vm.outputs.ip }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          for attempt in {1..30}; do
            ssh-keyscan -H "$VM_IP" >> ~/.ssh/known_hosts 2>/dev/null && break
            sleep 5
          done
          test -s ~/.ssh/known_hosts

      - name: Deploy application
        if: github.event_name == 'push'
        env:
          VM_IP: ${{ steps.vm.outputs.ip }}
        run: |
          docker save "sentiment-api:${GITHUB_SHA}" | gzip > /tmp/sentiment-api.tar.gz
          scp /tmp/sentiment-api.tar.gz ubuntu@"$VM_IP":/tmp/sentiment-api.tar.gz
          scp scripts/deploy_app.sh ubuntu@"$VM_IP":/tmp/deploy_app.sh
          ssh ubuntu@"$VM_IP" "sudo cloud-init status --wait && chmod +x /tmp/deploy_app.sh && sudo /tmp/deploy_app.sh /tmp/sentiment-api.tar.gz sentiment-api:${GITHUB_SHA}"

      - name: Run real Qwen smoke test
        if: github.event_name == 'push'
        env:
          APP_URL: http://${{ steps.vm.outputs.ip }}:8000
        run: python scripts/e2e_test.py
